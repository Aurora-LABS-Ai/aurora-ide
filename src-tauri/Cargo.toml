[package]
name = "aurora"
# Source of truth for the user-visible app version is `package.json`
# (`tauri.conf.json` reads it via the `"../package.json"` shorthand,
# the frontend imports it through `src/lib/app-version.ts`). This
# Cargo.toml entry is for the Rust crate's own metadata only —
# nothing user-facing — but we keep it in lockstep with package.json
# to avoid surprising `cargo` consumers. Bump both together.
version = "2.0.0"
description = "Aurora - AI-Powered Agentic Code Editor"
authors = ["Aurora Team"]
edition = "2021"
default-run = "aurora"

[lib]
name = "aurora_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables the multi-webview API (Window::add_child / WebviewBuilder)
# used by the agent window's embedded in-tab browser (commands::embedded_browser).
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "devtools", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
# `gzip`/`brotli`/`deflate` let the web tools accept compressed pages, which is
# what every site serves a browser — without them a page arrives as compressed
# bytes and parses as garbage. `cookies` is needed because search endpoints set
# a session cookie on the first request and serve a challenge page without it.
reqwest = { version = "0.12", features = [
    "json",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "cookies",
] }
eventsource-stream = "0.2"
futures = "0.3"
futures-util = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "0.33", default-features = false }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"            # `async fn` in traits with dyn-dispatch (agent_runtime)
hostname = "0.4"
notify = "6"
grep = "0.3"
grep-regex = "0.1"
grep-searcher = "0.1"
toml = "0.8"

# Database dependencies
rusqlite = { version = "0.38.0", features = ["bundled", "serde_json"] }
time = { version = "0.3", features = ["serde", "formatting"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Diff library for comparing file changes
similar = "2"

# Web search + page fetch (src/websearch). Aurora reads the open web itself
# rather than through a wrapper crate: the engine's result markup and a page's
# article body are two different parsing problems, and both need to fail out
# loud when a site changes shape.
#
# `dom_query` is the one HTML engine — it parses the search engine's result
# page AND backs `dom_smoothie`, so there is a single selector implementation
# in the build instead of two. `dom_smoothie` is a Rust port of the Readability
# algorithm Firefox Reader View uses; it finds the article body and drops nav,
# scripts and boilerplate. `htmd` then turns that body into Markdown, so
# headings, lists, tables and code blocks survive into the model's context
# instead of collapsing into one run-on line of text.
dom_query = "0.28"
dom_smoothie = "0.18"
htmd = "0.5"
# arXiv answers in Atom and nothing else, so the scholarly back ends need a
# real XML reader. `dom_query` is an HTML engine: html5ever gives `<title>` its
# own RAWTEXT parsing rules and relocates it, which is fine for a results page
# and wrong for a feed whose every entry carries one. Already in the tree as a
# transitive dependency, so naming it here costs no extra build.
quick-xml = "0.38"
# Pages still ship Shift_JIS, windows-1251 and friends. `encoding_rs` decodes
# by the label the server (or the page's own <meta charset>) declares; assuming
# UTF-8 turns every such page into replacement characters.
encoding_rs = "0.8"
# Parses the `Content-Type` header so a PDF, a zip or an image is named as
# unreadable rather than fed through an HTML parser as if it were a page.
mime = "0.3"


# Lazy static for singleton patterns
lazy_static = "1.4"

# Cross-platform directories
dirs = "5.0"
dunce = "1"               # Strips Windows UNC \\?\ prefix for stable path comparisons (agent_safety)

# Performance optimizations
lru = "0.13"            # LRU cache for file contents
parking_lot = "0.12"    # Faster mutexes than std::sync
dashmap = "6"           # Concurrent hashmap for caching
rayon = "1.10"          # Data-parallel I/O & CPU work (file batch reads, search/replace fan-out)
memchr = "2.7"          # SIMD-accelerated byte search powering native search/replace

# PTY support for native terminal
tauri-plugin-pty = "0.1"

# MCP (Model Context Protocol) client support
rmcp = { version = "0.1", features = ["client", "transport-child-process", "transport-sse"] }

# Code index — structural symbol/reference index over the workspace
# (src/code_index). tree-sitter parses syntax only: no toolchain on the user's
# machine, and a half-written file still yields the symbols around the break,
# which a language server cannot do. `ignore` is ripgrep's walker, already the
# engine behind the `grep` tool, so .gitignore is honoured for free.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
# The rest of the roster. Each grammar is one dep, one `.scm`, and one arm in
# `Lang::from_path` — see `code_index/lang.rs`. Grammar crates pin their own
# tree-sitter-language ABI, which is why 0.23-era grammars link against
# tree-sitter 0.26 unchanged.
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-dart = "0.2"
streaming-iterator = "0.1"   # tree-sitter 0.25+ returns QueryMatches as a StreamingIterator
ignore = "0.4"

# Token counting (accurate tokenizers for GPT-4, Claude, etc.)
tiktoken-rs = "0.6"

# CLI argument parsing for `aurora .` command
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
# Cursor provider wire schema. Its own crate so 7.6k lines of generated
# protobuf compile once and stay cached instead of being rebuilt on every
# edit to `aurora` (see crates/cursor-proto/Cargo.toml).
prost = "0.13"
cursor-proto = { path = "../crates/cursor-proto" }
# Cursor may set the Connect `compressed` flag on a stream frame; without this
# those frames decode to garbage rather than failing loudly.
flate2 = "1"
anyhow = "1"

# Image post-processing (decode → downscale → re-encode JPEG) for everything a
# vision model is shown: browser screenshots, and files opened with `file_read`.
# The feature list is exactly the four formats the vision APIs themselves accept,
# so Aurora can decode anything it is allowed to send and nothing it is not.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Codex (ChatGPT) provider — PKCE code-challenge hashing + verifier entropy
sha2 = "0.10"
rand = "0.8"

# Single instance detection (prevent multiple instances, pass args to existing)
single-instance = "0.3"
# ── `aurora` CLI presentation (src/cli_delegate) ─────────────────────────────
#
# The CLI is a real surface, not a debug affordance: `aurora agent` dispatches
# work into a running Aurora and `--follow` watches it run. These four are what
# make that readable.
#
# `crossterm` is the terminal backend — raw mode, key events, and the ANSI
# support detection that makes styled output degrade correctly on a legacy
# Windows console instead of printing escape codes at the user. Everything
# below sits on it, so it is one backend in the build rather than three.
crossterm = "0.29.0"
# `ratatui` draws the live `--follow --tui` view: a running transcript, the
# tool currently executing, and the token/cost counters, all redrawn in place.
# A line-printing loop cannot do that without owning the whole scrollback.
#
# Deliberately NOT the default for `--follow`. Plain follow stays a line
# stream, because its main consumer is another program tailing the file (see
# `cli_delegate::task`), and an alt-screen TUI has no useful text form.
ratatui = "0.30.2"
# `inquire` is the interactive half: picking a model when a name like
# `glm-5.2` exists under several providers, or picking a thread when
# `--continue` names one that no longer exists. The alternative is making the
# user re-run the command with an id copied from a list, which is the exact
# friction this CLI is meant to remove.
inquire = "0.9.4"
# `indicatif` covers the non-TUI waits — dispatching, waiting for a cold
# Aurora to come up — where a spinner and an elapsed clock are the whole
# requirement and a full terminal takeover would be absurd.
indicatif = "0.18.6"
# `comfy-table` lays out `aurora models` / `aurora threads`. Column widths
# have to be computed from the content (provider ids and model keys vary
# wildly in length) and it handles the unicode width accounting that naive
# `{:<20}` padding gets wrong.
comfy-table = "8.0.0"

# Note: Checkpoint system uses git CLI directly instead of git2
# because git2's index operations don't properly work with external worktrees

# Note: Undo/Redo uses a simple custom stack implementation
# (the undo crate's API was not a good fit for our per-file use case)

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# `Win32_Globalization` supplies MultiByteToWideChar, used to decode console
# output that PowerShell / cmd emit in the OEM code page rather than UTF-8.
# `Win32_System_Diagnostics_Debug` + `Win32_System_Threading` are the fatal-crash
# reporter in `crash.rs`: a vectored exception handler plus the stack guarantee
# that lets it run when the crash IS an exhausted stack. The FileSystem/Time
# groups are its allocation-free writer (a handle opened at install, raw
# `WriteFile`, no `format!`).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    # `AttachConsole` + `GetStdHandle`. Aurora ships as ONE windowless binary
    # that is also its own CLI, and a windowless process starts with no console
    # — so every `aurora --help` in a release build printed nothing at all.
    # `crate::console` borrows the parent terminal back. See its module docs.
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    # `CreateToolhelp32Snapshot` + `Process32FirstW/NextW`, used by
    # `commands::terminal` to find what a shell has left running before its tab
    # is closed. Chosen over shelling out to wmic/PowerShell: it needs no child
    # process, and wmic is gone on current Windows 11.
    "Win32_System_Diagnostics_ToolHelp",
    # Job objects: `commands::process_tracking` assigns each agent shell to a
    # job so that, at exit, "what did this command leave running?" is answered
    # by job MEMBERSHIP — which survives dead intermediate processes, unlike a
    # parent-pid walk (git-bash launches through a wrapper, so the chain to a
    # `sleep &` survivor breaks the moment the shell dies).
    "Win32_System_JobObjects",
    # `EXCEPTION_POINTERS`, `PVECTORED_EXCEPTION_HANDLER` and
    # `AddVectoredExceptionHandler` are all gated on this one, not on
    # `Diagnostics_Debug` as their documentation placement suggests.
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
] }
# Higher-level COM-friendly bindings used by the WebView2-native screenshot
# path in `services::browser_native_capture::windows`. The version is pinned
# to whatever `webview2-com` itself depends on so we share one copy of the
# generated COM bindings instead of pulling a parallel duplicate.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # System font-family enumeration for the Appearance font pickers
    # (commands::fonts). DirectWrite names are what Chromium/CSS matches.
    "Win32_Graphics_DirectWrite",
] }
# Direct dependency on webview2-com so we can call `ICoreWebView2::CapturePreview`
# via Tauri's `Webview::with_webview` platform escape hatch. It was already a
# transitive dep through wry; promoting it to a direct dep just lets us name
# the types in our own code.
webview2-com = "0.38"

[dev-dependencies]
# Isolated tempdirs for filesystem tests (threads JSONL, paths, writer/reader).
tempfile = "3"
# `test-util` is NOT part of tokio's "full", and it is what makes
# `#[tokio::test(start_paused = true)]` available. The stream-retry tests wait
# out a 1s/2s backoff; with a paused clock tokio auto-advances it, so the suite
# proves the backoff without spending the seconds. Dev-only — the shipped
# binary never links it.
tokio = { version = "1", features = ["test-util"] }

[patch.crates-io]
# tokenizers enables esaxx-rs/cpp by default. The upstream esaxx-rs build uses
# the static MSVC CRT, which conflicts with cxx's dynamic CRT when Aurora links
# its Tauri cdylib. The vendored build also gives MSVC its native `/std` flag;
# upstream passes GCC's `-std=c++11`, which cl.exe ignores with warning D9002.
# candle-kernels builds its CUDA MOE archive with the static MSVC CRT by default.
# Aurora links a Tauri cdylib with dynamic CRT dependencies, so keep the crate
# source identical except for passing /MD to nvcc's host compiler on MSVC.

[features]
# `cpu-only` no longer gates anything: speech moved out of process (CrispASR),
# so there is no compiled GPU runtime left to opt into. Kept as the default so
# an existing build command with `--features cpu-only` still resolves.
default = ["cpu-only"]

# CPU-only build (no GPU acceleration) — safest default
cpu-only = []

# CLI mode - enables console window for CLI commands on Windows
cli-mode = []

# `verify_only` is consumed by the standalone verification crates under
# `target/__verify_*` that mount Aurora's source via `#[path]` to test a
# single module in isolation (the main `cargo test` binary cannot launch
# on Windows because of an ONNX runtime DLL link order issue). Production
# builds never enable it; the gated `#[cfg(feature = "verify_only")]`
# blocks pivot to no-op stubs in that mode and the live Tauri/system
# implementations otherwise. Declared here so rustc's `unexpected_cfgs`
# lint accepts the cfg name without us having to scatter
# `#[allow(unexpected_cfgs)]` across every module that touches it.
verify_only = []

# ── Dev profile ──────────────────────────────────────────────────────────────
#
# Tuned for the edit → rebuild loop, not for a clean build. The split matters:
# dependencies compile ONCE and are cached, so they can afford optimization;
# `aurora` itself is recompiled on every save, so it must not.
#
# Everything below is scoped so a change here invalidates only `aurora` — the
# cached dependency artifacts (candle, ONNX, tokenizers, tauri) stay valid.
# Putting `debug` or `opt-level` on `[profile.dev]` itself would apply to
# dependencies too and force a full rebuild of the whole tree.
[profile.dev]
# Restores cargo's default for this profile, replacing the `CARGO_INCREMENTAL`
# env var that used to disable it for every profile. See `.cargo/config.toml`.
incremental = true

[profile.dev.package.aurora]
# Was 1, via `[profile.dev]`. The optimizer ran over the whole crate on every
# rebuild for a runtime gain that belongs to the dependencies below, not to
# Aurora's own glue code.
opt-level = 0
# Backtraces keep file:line; what goes is variable-level inspection, which also
# shrinks the PDB the linker writes on every rebuild. Set back to `true` if you
# need to attach a debugger and step through Rust state.
debug = "line-tables-only"

# Dependencies only — cargo's `"*"` glob excludes workspace members. Kept at 2
# because the speech path (candle / ONNX / tokenizers) is genuinely unusable
# with unoptimized dependencies.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
# Line tables, kept. `strip = true` was why the 2026-08-17 stack overflow could
# not be diagnosed: the pdb held 6,685 public symbols and no line coverage for
# the crate's own code, so every frame in `aurora-crash.log` resolved to a
# WebView2 trace-logging annotation 400 KB away. On MSVC the debug info lives in
# the .pdb, not the .exe, so this costs binary size nothing — it only makes the
# pdb bigger and the crash reports readable. Keep the pdb for any build whose
# crash logs you may need to read.
strip = false
debug = "line-tables-only"
