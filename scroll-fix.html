<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Coding Agent — Work Card Demo</title>
  <style>
    :root {
      --bg-page: #111214;
      --bg-card: #111214;
      --bg-chip: rgba(255, 255, 255, 0.065);
      --bg-chip-hover: rgba(255, 255, 255, 0.1);
      --bg-row-hover: rgba(255, 255, 255, 0.028);
      --bg-drawer: #0c0d0f;
      --text-primary: #e3e5e8;
      --text-secondary: #7b8089;
      --text-muted: #585c64;
      --text-narration: #c9cdd4;
      --accent-blue: #3b82f6;
      --accent-cyan: #58a6ff;
      --accent-green: #3fb950;
      --spine-color: rgba(255, 255, 255, 0.075);
      --rule-color: rgba(255, 255, 255, 0.06);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page-wrapper {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      padding: 28px 18px 80px;
    }

    /* -----------------------------------------------------------
       CONTROL BAR ABOVE THE CARD
    ----------------------------------------------------------- */
    .control-bar {
      display: flex;
       flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      user-select: none;
    }

    .ctrl-btn {
      background: #17191c;
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 6px;
      padding: 6px 14px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.06s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
    }

    .ctrl-btn:hover {
      background: #212429;
      border-color: rgba(255, 255, 255, 0.22);
    }

    .ctrl-btn:active {
      transform: translateY(1px);
    }

    .ctrl-btn.active-toggle {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.45);
      color: #93c5fd;
    }

    .ctrl-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 13px;
      margin-left: 4px;
    }

    .ctrl-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 116px;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(to right, #2563eb 0%, #2563eb var(--slider-pct, 65%), #e2e4e8 var(--slider-pct, 65%), #e2e4e8 100%);
      outline: none;
      cursor: pointer;
    }

    .ctrl-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #2563eb;
      border: 2px solid #111214;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.5);
      cursor: pointer;
    }

    .ctrl-slider::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #2563eb;
      border: 2px solid #111214;
      cursor: pointer;
    }

    .ctrl-checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      margin-left: 4px;
    }

    .ctrl-checkbox-label input {
      width: 14px;
      height: 14px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    .ctrl-status-pill {
      margin-left: auto;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.035);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
    }

    .status-dot.paused {
      background: #f59e0b;
    }

    /* -----------------------------------------------------------
       WORK CARD HEADER
    ----------------------------------------------------------- */
    .work-card {
      position: relative;
      width: 100%;
      user-select: none;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
      padding: 0 2px;
      gap: 12px;
      cursor: pointer;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .header-spinner {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1.75px solid rgba(88, 166, 255, 0.22);
      border-top-color: #58a6ff;
      border-right-color: rgba(88, 166, 255, 0.65);
      animation: spin 0.85s linear infinite;
      flex-shrink: 0;
    }

    .header-spinner.done {
      border-color: var(--accent-green);
      animation: none;
      background: rgba(63, 185, 80, 0.16);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Shimmer text effect for "Working" and "Thinking" */
    .shimmer-word {
      font-weight: 500;
      font-size: 14px;
      background: linear-gradient(
        90deg,
        #8b929e 0%,
        #f0f3f8 45%,
        #ffffff 50%,
        #f0f3f8 55%,
        #8b929e 100%
      );
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmerMove 2.2s linear infinite;
      flex-shrink: 0;
    }

    .shimmer-word.paused {
      background: none;
      color: var(--text-primary);
      animation: none;
    }

    @keyframes shimmerMove {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .header-activity {
      color: var(--text-secondary);
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .header-chevron {
      width: 14px;
      height: 14px;
      color: var(--text-secondary);
      transition: transform 0.18s ease;
    }

    .work-card.collapsed .header-chevron {
      transform: rotate(-90deg);
    }

    /* -----------------------------------------------------------
       CARD WINDOW & VERTICAL SPINES
    ----------------------------------------------------------- */
    .card-window-shell {
      position: relative;
      margin-top: 2px;
      transition: opacity 0.2s ease;
    }

    .work-card.collapsed .card-window-shell {
      display: none;
    }

    /* Vertical hairline spines on left and right edges, fading at top & bottom */
    .spine-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      transition: opacity 0.2s ease;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.085) 14%,
        rgba(255, 255, 255, 0.085) 86%,
        rgba(255, 255, 255, 0) 100%
      );
    }

    .spine-line.left {
      left: 6px;
    }

    .spine-line.right {
      right: 6px;
    }

    .show-spines .spine-line {
      opacity: 1;
    }

    /* Fixed max-height window (480px) that grows smoothly until full */
    .card-viewport {
      position: relative;
      overflow: hidden;
      max-height: 480px;
      padding: 0 22px 0 26px;
      will-change: height;
    }

    /* Soft fade mask at the top when older steps are scrolled above the top edge */
    .top-fade-overlay {
      position: absolute;
      top: 0;
      left: 7px;
      right: 7px;
      height: 38px;
      background: linear-gradient(
        to bottom,
        var(--bg-page) 0%,
        rgba(17, 18, 20, 0.86) 45%,
        rgba(17, 18, 20, 0) 100%
      );
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .top-fade-overlay.visible {
      opacity: 1;
    }

    /* Subtle bottom fade so the very bottom edge looks polished */
    .bottom-fade-overlay {
      position: absolute;
      bottom: 0;
      left: 7px;
      right: 7px;
      height: 12px;
      background: linear-gradient(
        to top,
        var(--bg-page) 0%,
        rgba(17, 18, 20, 0) 100%
      );
      pointer-events: none;
      z-index: 3;
      opacity: 0.65;
    }

    /* Inner track translated by our custom subpixel-crisp glide physics engine */
    .steps-track {
      position: relative;
      width: 100%;
      transform: translate3d(0, 0, 0);
      padding-top: 4px;
      padding-bottom: 6px;
    }

    /* Floating "Resume auto-scroll" pill when user scrolls up */
    .resume-scroll-btn {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translate(-50%, 10px);
      background: rgba(26, 29, 34, 0.95);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
      border-radius: 999px;
      padding: 5px 13px;
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease, background 0.12s ease;
    }

    .resume-scroll-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }

    .resume-scroll-btn:hover {
      background: #252930;
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* -----------------------------------------------------------
       STEP ROWS (TOOL CALLS, THOUGHTS, NARRATION)
    ----------------------------------------------------------- */
    .step-item {
      width: 100%;
      /* Avoid layout shifts across neighboring items */
      contain: layout style;
    }

    /* 1. TOOL CALL ROW (~29px - 31px) */
    .tool-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.1s ease;
      gap: 10px;
    }

    .tool-row:hover {
      background-color: var(--bg-row-hover);
    }

    .tool-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    /* Status container (14x14 fixed so spinner -> checkmark never shifts horizontally) */
    .status-cell {
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .row-spinner {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1.5px solid rgba(123, 128, 137, 0.28);
      border-top-color: #9ca3af;
      animation: spin 0.75s linear infinite;
    }

    /* When running, screenshot shows a subtle blank or faint spinner space next to tool icon */
    .status-cell.running-subtle .row-spinner {
      opacity: 0.35;
    }

    .check-icon {
      width: 13px;
      height: 13px;
      color: var(--accent-green);
      display: block;
    }

    .tool-icon {
      width: 15px;
      height: 15px;
      color: var(--text-secondary);
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tool-verb {
      font-weight: 600;
      font-size: 13.5px;
      color: var(--text-primary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Monospace argument chip */
    .chip-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
    }

    .arg-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-chip);
      padding: 1.5px 7px;
      border-radius: 5px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      color: #c6cad2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 340px;
      line-height: 1.35;
    }

    .arg-chip.mono {
      font-family: var(--font-mono);
      font-size: 12px;
      color: #d6dae2;
      font-weight: 500;
    }

    /* Tiny file/doc badge inside chip matching screenshot */
    .chip-badge-icon {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      border-radius: 2px;
    }

    .inline-note {
      color: var(--text-secondary);
      font-size: 13px;
      white-space: nowrap;
      margin-left: 2px;
    }

    . inline-dur {
      color: var(--text-secondary);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      margin-left: 4px;
    }

    /* Right side result & duration */
    .tool-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-shrink: 0;
      font-size: 13px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      min-width: 145px;
    }

    .tool-result-text {
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .tool-duration {
      color: var(--text-secondary);
      min-width: 32px;
      text-align: right;
      white-space: nowrap;
    }

    .row-chevron {
      width: 14px;
      height: 14px;
      color: var(--text-secondary);
      opacity: 0.75;
      transition: transform 0.16s ease, opacity 0.16s ease;
      flex-shrink: 0;
    }

    .tool-row:hover .row-chevron {
      opacity: 1;
    }

    .step-item.expanded .row-chevron {
      transform: rotate(180deg);
      opacity: 1;
    }

    /* 2. THINKING ROW (~23px tall) */
    .thought-row {
      display: flex;
      align-items: center;
      height: 23px;
      padding: 0 6px;
      gap: 8px;
      cursor: pointer;
      border-radius: 4px;
      color: var(--text-secondary);
      font-size: 13px;
      transition: color 0.12s ease, background-color 0.12s ease;
    }

    .thought-row:hover {
      color: #aeb4be;
      background-color: var(--bg-row-hover);
    }

    .thought-chevron {
      width: 12px;
      height: 12px;
      color: var(--text-secondary);
      transition: transform 0.16s ease;
      flex-shrink: 0;
    }

    .step-item.expanded .thought-chevron {
      transform: rotate(90deg);
    }

    .thought-label {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .thought-label.active-shimmer {
      background: linear-gradient(
        90deg,
        #7b8089 0%,
        #d8dce3 45%,
        #ffffff 50%,
        #d8dce3 55%,
        #7b8089 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmerMove 1.8s linear infinite;
    }

    .thought-rule {
      height: 1px;
      width: 30px;
      background: var(--rule-color);
      flex-shrink: 0;
    }

    .thought-timer {
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      font-size: 13px;
      white-space: nowrap;
    }

    .thought-tail-rule {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(255,255,255,0.035), rgba(255,255,255,0));
      margin-left: 6px;
    }

    /* 3. NARRATION ROW (15px normal prose, streams word by word) */
    .narration-row {
      padding: 5px 6px 6px 6px;
      font-size: 15px;
      line-height: 1.48;
      color: var(--text-narration);
      user-select: text;
      word-break: break-word;
    }

    .narration-cursor {
      display: inline-block;
      width: 6px;
      height: 14px;
      vertical-align: -2px;
      margin-left: 3px;
      background: rgba(255, 255, 255, 0.45);
      animation: blinkCursor 0.8s steps(2, start) infinite;
    }

    @keyframes blinkCursor {
      to { visibility: hidden; }
    }

    /* EXPANDABLE DRAWER FOR TOOL CALLS AND THOUGHTS */
    .step-drawer {
      display: none;
      margin: 2px 6px 6px 29px;
      padding: 8px 12px;
      background: var(--bg-drawer);
      border: 1px solid rgba(255, 255, 255, 0.065);
      border-radius: 6px;
      font-size: 12.5px;
      line-height: 1.5;
      color: #9ca3af;
      user-select: text;
    }

    .step-drawer.mono-drawer {
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: pre-wrap;
      color: #adb5c2;
    }

    .step-item.expanded .step-drawer {
      display: block;
    }

    @media (max-width: 640px) {
      .arg-chip {
        max-width: 165px;
      }
      .tool-right {
        min-width: 90px;
      }
      .header-right {
        font-size: 11.5px;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <!-- Top Control Bar matching the screenshot -->
    <div class="control-bar">
      <button id="btnToggleRun" class="ctrl-btn" type="button">Pause</button>
      <button id="btnEndTurn" class="ctrl-btn" type="button">End turn</button>
      <button id="btnBurst" class="ctrl-btn" type="button">Burst (4)</button>

      <div class="ctrl-group">
        <label for="speedSlider">Step every</label>
        <input
          id="speedSlider"
          class="ctrl-slider"
          type="range"
          min="120"
          max="1100"
          value="520"
        />
      </div>

      <label class="ctrl-checkbox-label">
        <input id="chkSpine" type="checkbox" checked />
        <span>Spine</span>
      </label>

      <div class="ctrl-status-pill" id="scrollStatusPill" title="Scroll with mouse wheel or click a step to test auto-scroll lock">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Following · 0 steps</span>
      </div>
    </div>

    <!-- AI Coding Agent Work Card -->
    <div id="workCard" class="work-card show-spines">
      <!-- Header Line -->
      <div id="cardHeader" class="card-header">
        <div class="header-left">
          <div id="headerSpinner" class="header-spinner"></div>
          <span id="headerVerb" class="shimmer-word">Working</span>
          <span id="headerActivity" class="header-activity">Reading navigation.config.ts</span>
        </div>
        <div class="header-right">
          <span id="headerStats">0 thoughts · 0 calls · 0 files read · 0 commands · 0s</span>
          <svg class="header-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 6 8 10 12 6"></polyline>
          </svg>
        </div>
      </div>

      <!-- Fixed-max-height (480px) Window with Fading Spines & Top Fade -->
      <div class="card-window-shell">
        <div class="spine-line left"></div>
        <div class="spine-line right"></div>
        <div id="topFadeOverlay" class="top-fade-overlay"></div>
        <div class="bottom-fade-overlay"></div>

        <div id="cardViewport" class="card-viewport" style="height: 0px;">
          <div id="stepsTrack" class="steps-track"></div>
        </div>

        <button id="btnResumeScroll" class="resume-scroll-btn" type="button">
          <span>↓ Follow new steps</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      /* =====================================================================
         SVG ICON TEMPLATES (Clean inline vectors matching the screenshot)
      ===================================================================== */
      const ICONS = {
        check: `<svg class="check-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3.2 8.5 6.5 11.8 12.8 4.5"></polyline></svg>`,
        chevronDown: `<svg class="row-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4.5 6.2 8 9.8 11.5 6.2"></polyline></svg>`,
        chevronRight: `<svg class="thought-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 4 10 8 6 12"></polyline></svg>`,
        read: `<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2H4.2A1.2 1.2 0 0 0 3 3.2v9.6A1.2 1.2 0 0 0 4.2 14h6.6a1.2 1.2 0 0 0 1.2-1.2V5.5L9.5 2z"/><polyline points="9 2 9 6 12 6"/><circle cx="10.8" cy="11.2" r="2.1"/><line x1="12.4" y1="12.8" x2="14" y2="14.2"/></svg>`,

      /* =====================================================================
         CONTINUOUS-GLIDE SCROLL PHYSICS ENGINE
         - Keeps newest step anchored to the bottom edge.
         - Never jumps: uses velocity-smoothed continuous pursuit so bursts
           and word-by-word line wraps glide at an even, fluid rate and ease
           gently to a crisp device-pixel-aligned rest when paused.
      ===================================================================== */
      let trackHeight = 0;
      let currentViewportHeight = 0;
      let targetViewportHeight = 0;

      let currentScrollY = 0; // Positive number = how many px scrolled down from top
      let targetScrollY = 0;
      let scrollVelocity = 0; // px per second
      let isFollowing = true; // True when auto-scrolling to bottom

      let lastFrameTime = performance.now();

      function updateTargetMetrics() {
        trackHeight = stepsTrack.offsetHeight;
        targetViewportHeight = Math.min(MAX_VIEWPORT_HEIGHT, trackHeight);
        if (isFollowing) {
          targetScrollY = Math.max(0, trackHeight - targetViewportHeight);
        } else {
          // Keep target clamped if content shrinks
          const maxScroll = Math.max(0, trackHeight - targetViewportHeight);
          if (targetScrollY > maxScroll) targetScrollY = maxScroll;
        }
      }

      // Observe any height changes in the track (new rows, line wraps, drawer expand)
      const resizeObserver = new ResizeObserver(() => {
        updateTargetMetrics();
      });
      resizeObserver.observe(stepsTrack);

      function snapToDevicePixel(value) {
        const dpr = window.devicePixelRatio || 1;
        return Math.round(value * dpr) / dpr;
      }

      function animationTick(now) {
        const dt = Math.min(0.05, Math.max(0.001, (now - lastFrameTime) / 1000));
        lastFrameTime = now;

        updateTargetMetrics();

        // 1. Smoothly grow viewport height from 0 -> 480px until full
        const heightDiff = targetViewportHeight - currentViewportHeight;
        if (Math.abs(heightDiff) > 0.25) {
          // Smooth exponential approach for container growth
          currentViewportHeight += heightDiff * (1 - Math.exp(-14 * dt));
          cardViewport.style.height = snapToDevicePixel(currentViewportHeight) + "px";
        } else if (currentViewportHeight !== targetViewportHeight) {
          currentViewportHeight = targetViewportHeight;
          cardViewport.style.height = targetViewportHeight + "px";
        }

        // 2. Continuous-glide scroll position update
        const dist = targetScrollY - currentScrollY;

        if (Math.abs(dist) > 0.15 || Math.abs(scrollVelocity) > 0.5) {
          if (isFollowing) {
            /*
              Critically-damped / constant-cruise pursuit controller:
              - When `dist` is moderate (15px - 120px), it cruises at a steady,
                pleasant speed without stopping between steps.
              - As `dist` approaches 0, it eases gently to rest without overshoot.
              - If a huge burst arrives (`dist` > 140px), it smoothly accelerates
                proportionally so it never falls behind.
            */
            const stiffness = 11.5; // Controls how smoothly it catches up
            const desiredVel = dist * stiffness;
            // Blend velocity smoothly so sudden row insertions never cause a velocity spike
            const velBlend = 1 - Math.exp(-18 * dt);
            scrollVelocity += (desiredVel - scrollVelocity) * velBlend;

            let stepMove = scrollVelocity * dt;
            // Prevent overshooting target when easing to rest
            if ((dist > 0 && stepMove > dist) || (dist < 0 && stepMove < dist)) {
              stepMove = dist;
              scrollVelocity = 0;
            }
            currentScrollY += stepMove;
          } else {
            // User wheel scroll: responsive direct smoothing
            currentScrollY += dist * (1 - Math.exp(-26 * dt));
            scrollVelocity = 0;
          }

          // When nearly at rest, snap to exact device pixel for 100%/125%/150% DPI crispness
          if (Math.abs(targetScrollY - currentScrollY) < 0.25) {
            currentScrollY = targetScrollY;
            scrollVelocity = 0;
          }

          const renderY =
            Math.abs(scrollVelocity) < 8
              ? snapToDevicePixel(currentScrollY)
              : currentScrollY;

          stepsTrack.style.transform = `translate3d(0, ${-renderY}px, 0)`;
        }

        // 3. Toggle top soft fade overlay when older steps are cut off at top
        if (currentScrollY > 4) {
          topFadeOverlay.classList.add("visible");
        } else {
          topFadeOverlay.classList.remove("visible");
        }

        requestAnimationFrame(animationTick);
      }

      /* =====================================================================

      function setFollowingState(follow) {
        isFollowing = follow;
        if (isFollowing) {
          targetScrollY = Math.max(0, trackHeight - targetViewportHeight);

      cardViewport.addEventListener(

          const delta = e.deltaY;

          if (delta < 0) {
            // Reader scrolled up: pause auto-scroll right where they are
            if (isFollowing) {
              targetScrollY = currentScrollY;
              setFollowingState(false);
            }
            targetScrollY = Math.max(0, targetScrollY + delta);
          } else if (delta > 0) {
            if (!isFollowing) {
              targetScrollY = Math.min(maxScroll, targetScrollY + delta);
              // If scrolled back within 10px of the bottom, resume following automatically
              if (maxScroll - targetScrollY <= 10) {
                setFollowingState(true);
              }
            }
          }
        },
        { passive: false }

        return { row, tpl };

          const tId = setTimeout(() => {
            activeTimers.delete(tId);
            // In bursts, mostly drop tool calls & quick thoughts
            if (i === 1 && Math.random() < 0.35) {
              appendThoughtStep();
            } else {
              appendToolStep();
            }
          }, i * 115);
          activeTimers.add(tId);
        }
      }

      function scheduleNextStep() {
        if (!isGenerating || isTurnEnded) return;

        const baseInterval = Number(speedSlider.value); // 120ms - 1100ms
        // Scale random interval around slider setting (between ~150ms and ~900ms at default)
        const jitter = 0.45 + Math.random() * 1.1;
        const delay = Math.max(130, Math.round(baseInterval * jitter));

        nextStepTimer = setTimeout(() => {

          // ~16% chance to emit a quick burst of 3-4 steps
          if (Math.random() < 0.16) {
            const burstSize = 3 + Math.floor(Math.random() * 2);
            triggerBurst(burstSize);
            scheduleNextStep();
          } else {
            spawnRandomStep();
            scheduleNextStep();
          }
        }, delay);

        appendThoughtStep("0.7s", true);         // > Thought 0.7s
        appendToolStep(TOOL_TEMPLATES[1], true); // Read service.go 0.8s
        appendToolStep(TOOL_TEMPLATES[2], true); // Search internal func \(m \*Module\) 0.6s
        appendToolStep(TOOL_TEMPLATES[3], true); // Find gadget-and-power-backend... 20 files 1.1s
        appendToolStep(TOOL_TEMPLATES[4], true); // Run Command
        appendToolStep(TOOL_TEMPLATES[0], false); // Read navigation.config.ts Running...

        // Align initial counters with screenshot
        stats.thoughts = 5;
        stats.calls = 26;
        stats.filesRead = 11;
        stats.commands = 5;
        stats.elapsedSeconds = 44;
        updateHeaderDisplay("Reading navigation.config.ts");

        // Measure and position immediately at the bottom on load
        updateTargetMetrics();
        currentViewportHeight = targetViewportHeight;
        cardViewport.style.height = currentViewportHeight + "px";
        currentScrollY = targetScrollY;
        stepsTrack.style.transform = `translate3d(0, ${-snapToDevicePixel(currentScrollY)}px, 0)`;
      }

      /* =====================================================================
         CONTROLS & LIVE SECOND COUNTER
      ===================================================================== */
      function updateSliderFill() {
        const min = Number(speedSlider.min);
        const max = Number(speedSlider.max);
        const val = Number(speedSlider.value);
        // Invert visual fill so moving right feels like higher speed / more activity
        const pct = Math.round(((val - min) / (max - min)) * 100);
        speedSlider.style.setProperty("--slider-pct", pct + "%");
      }

      speedSlider.addEventListener("input", () => {
        updateSliderFill();
      });

      btnToggleRun.addEventListener("click", () => {
        if (isTurnEnded) {
          resumeTurn();
          return;
        }
        isGenerating = !isGenerating;
        btnToggleRun.textContent = isGenerating ? "Pause" : "Start";
        headerVerb.classList.toggle("paused", !isGenerating);
        if (isGenerating) {
          scheduleNextStep();
        } else if (nextStepTimer) {
          clearTimeout(nextStepTimer);
        }
        updateStatusBar();
      });

      function resumeTurn() {
        isTurnEnded = false;
        isGenerating = true;
        btnToggleRun.textContent = "Pause";
        btnEndTurn.textContent = "End turn";
        headerSpinner.classList.remove("done");
        headerVerb.textContent = "Working";
        headerVerb.classList.remove("paused");
        scheduleNextStep();
        updateStatusBar();
      }

      btnEndTurn.addEventListener("click", () => {
        if (!isTurnEnded) {
          isTurnEnded = true;
          isGenerating = false;
          if (nextStepTimer) clearTimeout(nextStepTimer);
          btnToggleRun.textContent = "Start";
          btnEndTurn.textContent = "New turn";
          headerSpinner.classList.add("done");
          headerVerb.textContent = "Worked";
          headerVerb.classList.add("paused");
          headerActivity.textContent = "Completed verification across 17 files";

          // Finish any in-flight tool rows immediately
          document.querySelectorAll(".tool-row").forEach((r) => {
            const res = r.querySelector('[data-role="result"]');
            if (res && res.textContent === "Running...") {
              completeToolRow(r, TOOL_TEMPLATES[0]);
            }
          });
          updateStatusBar();
        } else {
          resumeTurn();
        }
      });

      btnBurst.addEventListener("click", () => {
        triggerBurst(4);
      });

      chkSpine.addEventListener("change", () => {
        workCard.classList.toggle("show-spines", chkSpine.checked);
      });

      cardHeader.addEventListener("click", () => {
        workCard.classList.toggle("collapsed");
      });

      // Live 1-second ticker for the header ("... · 44s")
      setInterval(() => {
        if (isGenerating && !isTurnEnded) {
          stats.elapsedSeconds++;
          updateHeaderDisplay();
        }
      }, 1000);

      // Boot up demo
      updateSliderFill();
      seedInitialScreenshotSteps();
      requestAnimationFrame((now) => {
        lastFrameTime = now;
        animationTick(now);
      });
      scheduleNextStep();
    })();
  </script>
</body>
</html>
