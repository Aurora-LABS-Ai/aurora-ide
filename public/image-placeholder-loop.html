<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Image Placeholder Loop — Standalone</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0a0a09;
    color: #afaeac;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .stage {
    position: relative;
    width: min(448px, 100%);
    aspect-ratio: 1 / 1;
  }
  /* Outer glow stand-in for PulsingBorder (proprietary shader).
     Colors, 144% overscan, and speed matched to the component props. */
  .halo {
    position: absolute;
    top: 50%; left: 50%;
    width: 144%; height: 144%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    border-radius: 16px;
    background: conic-gradient(from 0deg,
      #0798f2, #0afbff, #206f2d, #0039e6, #2e74ff, #0798f2);
    filter: blur(48px) saturate(1.4);
    opacity: 0.5;
    animation: halo-spin 6.4s linear infinite, halo-breathe 2.6s ease-in-out infinite;
  }
  @keyframes halo-spin { to { filter: blur(48px) saturate(1.4) hue-rotate(360deg); } }
  @keyframes halo-breathe { 0%,100% { opacity: 0.35; } 50% { opacity: 0.6; } }
  .box {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    z-index: 1;
  }
  .box canvas { display: block; width: 100%; height: 100%; }
  /* Exact vignette gradients from image-placeholder.tsx */
  .vignette {
    position: absolute; inset: 0;
    border-radius: 16px;
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    animation: vignette-in 3s ease forwards;
  }
  @keyframes vignette-in { to { opacity: 1; } }
  .vignette-a {
    position: absolute; inset: 0; border-radius: 16px;
    background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,0.4) 65%, rgba(0,0,0,0.9) 100%);
  }
  .vignette-b {
    position: absolute; inset: 0; border-radius: 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.3) 100%);
  }
  .caption {
    position: absolute;
    left: 0; right: 0; bottom: -32px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  @media (prefers-reduced-motion: reduce) {
    .halo, .vignette { animation: none; }
    .vignette { opacity: 1; }
  }
</style>
</head>
<body>
  <main class="stage" aria-label="Image generation placeholder animation">
    <div class="halo" aria-hidden="true"></div>
    <div class="box">
      <canvas id="silk" aria-label="Generating image"></canvas>
      <div class="vignette" aria-hidden="true">
        <div class="vignette-a"></div>
        <div class="vignette-b"></div>
      </div>
    </div>
    <p class="caption">Silk loop — speed 19, scale 1.1, #7298bb, noise 2.7, rotation 2.33</p>
  </main>

<script>
(function () {
  var canvas = document.getElementById('silk');
  var gl = canvas.getContext('webgl', { antialias: false, alpha: false });
  if (!gl) { canvas.parentNode.style.background = '#7298bb'; return; }

  // Exact values from image-placeholder.tsx <Silk ... />
  var SPEED = 19.0;
  var SCALE = 1.1;
  var NOISE = 2.7;
  var ROTATION = 2.33;
  // #7298bb normalized
  var COLOR = [114 / 255, 152 / 255, 187 / 255];

  var vs = [
    'attribute vec2 p;',
    'varying vec2 vUv;',
    'void main() {',
    '  vUv = p * 0.5 + 0.5;',
    '  gl_Position = vec4(p, 0.0, 1.0);',
    '}'
  ].join('\n');

  // Verbatim fragment shader from alvanworld-webapp/components/Silk.tsx
  var fs = [
    'precision highp float;',
    'varying vec2 vUv;',
    'varying vec3 vPosition;',
    'uniform float uTime;',
    'uniform vec3 uColor;',
    'uniform float uSpeed;',
    'uniform float uScale;',
    'uniform float uRotation;',
    'uniform float uNoiseIntensity;',
    'const float e = 2.71828182845904523536;',
    'float noise(vec2 texCoord) {',
    '  float G = e;',
    '  vec2 r = (G * sin(G * texCoord));',
    '  return fract(r.x * r.y * (1.0 + texCoord.x));',
    '}',
    'vec2 rotateUvs(vec2 uv, float angle) {',
    '  float c = cos(angle);',
    '  float s = sin(angle);',
    '  mat2 rot = mat2(c, -s, s, c);',
    '  return rot * uv;',
    '}',
    'void main() {',
    '  float rnd = noise(gl_FragCoord.xy);',
    '  vec2 uv = rotateUvs(vUv * uScale, uRotation);',
    '  vec2 tex = uv * uScale;',
    '  float tOffset = uSpeed * uTime;',
    '  tex.y += 0.03 * sin(8.0 * tex.x - tOffset);',
    '  float pattern = 0.6 +',
    '    0.4 * sin(5.0 * (tex.x + tex.y +',
    '      cos(3.0 * tex.x + 5.0 * tex.y) +',
    '      0.02 * tOffset) +',
    '      sin(20.0 * (tex.x + tex.y - 0.1 * tOffset)));',
    '  vec4 col = vec4(uColor, 1.0) * vec4(pattern) - rnd / 15.0 * uNoiseIntensity;',
    '  col.a = 1.0;',
    '  gl_FragColor = col;',
    '}'
  ].join('\n');

  function shader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uTime = gl.getUniformLocation(prog, 'uTime');
  gl.uniform1f(gl.getUniformLocation(prog, 'uSpeed'), SPEED);
  gl.uniform1f(gl.getUniformLocation(prog, 'uScale'), SCALE);
  gl.uniform1f(gl.getUniformLocation(prog, 'uRotation'), ROTATION);
  gl.uniform1f(gl.getUniformLocation(prog, 'uNoiseIntensity'), NOISE);
  gl.uniform3f(gl.getUniformLocation(prog, 'uColor'), COLOR[0], COLOR[1], COLOR[2]);

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.parentNode.getBoundingClientRect();
    canvas.width = Math.max(2, Math.floor(r.width * dpr));
    canvas.height = Math.max(2, Math.floor(r.height * dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t = 0, last = performance.now();

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    // Matches SilkPlane useFrame: uTime += 0.1 * delta
    if (!reduce) t += 0.1 * dt;
    gl.uniform1f(uTime, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (reduce) { gl.uniform1f(uTime, 0); gl.drawArrays(gl.TRIANGLES, 0, 3); }
})();
</script>
</body>
</html>
