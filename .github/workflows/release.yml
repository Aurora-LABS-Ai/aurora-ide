name: Release

# Auto-builds and publishes a Windows installer when a `v*` tag is
# pushed. The single source of truth for the app version is
# `package.json`; `tauri.conf.json` reads `"../package.json"`, so
# bumping the package + pushing a matching tag is the whole release
# ritual:
#
#   1. Bump `package.json` (`version: "2.5.0"`).
#   2. Commit, push to main.
#   3. `git tag v2.5.0 && git push origin v2.5.0`.
#
# The action builds the Windows bundle and publishes a non-draft
# release with the .msi/.exe installers attached. `workflow_dispatch`
# is also exposed so a maintainer can trigger a manual build from the
# Actions tab without pushing a tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.5.0). Optional when re-running for an existing tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual dispatch can target an arbitrary ref. When no tag
          # is supplied we fall back to whatever ref the workflow
          # was launched against (usually `main`).
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          # `__VERSION__` is replaced by tauri-action with the
          # version resolved from `tauri.conf.json` (which itself
          # reads from `../package.json` — see version single-source
          # chain).
          tagName: v__VERSION__
          releaseName: "Aurora v__VERSION__"
          releaseBody: |
            Aurora v__VERSION__ — Windows installer.

            **What's in the box:**
            - `.msi` and `.exe` installers below.
            - Self-contained bundle (WebView2 bootstrapper, app binary).
            - `aurora` and `agw` added to PATH, so the agent can be driven from a terminal.

            **Install:** download the `.msi` (recommended) or `.exe`, run it, follow the wizard.
            **Requires:** Windows 10/11 x64.

            Built automatically from the `v__VERSION__` tag via the `Release` workflow.
          # Auto-publish — no manual "publish draft" step needed.
          releaseDraft: false
          prerelease: false
          # `Cargo.toml` sets `default = ["cpu-only"]`, which no longer
          # gates anything: speech runs out of process (CrispASR), so
          # there is no GPU runtime to compile in and no extra feature
          # flag for a release build.
